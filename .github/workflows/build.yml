name: Build and Publish

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a release (true/false)'
        required: false
        default: 'false'
      release_version:
        description: 'Release version (e.g., 1.0.1.8)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Build with Maven
        run: mvn -B clean package --file pom.xml
      
      - name: Run tests
        run: mvn -B test --file pom.xml
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binance-api-client-jar
          path: target/*.jar
          retention-days: 30
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 30

  publish:
    needs: build
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      
      - name: Configure Git
        if: github.event.inputs.release == 'true'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
      
      - name: Prepare release version
        if: github.event.inputs.release == 'true'
        run: |
          # Get release version from input or remove -SNAPSHOT
          if [ -n "${{ github.event.inputs.release_version }}" ]; then
            RELEASE_VERSION="${{ github.event.inputs.release_version }}"
          else
            RELEASE_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout | sed 's/-SNAPSHOT//')
          fi
          
          echo "RELEASE_VERSION=${RELEASE_VERSION}" >> $GITHUB_ENV
          
          # Check if tag already exists
          if git ls-remote --tags origin | grep -q "refs/tags/v${RELEASE_VERSION}$"; then
            echo "TAG_EXISTS=true" >> $GITHUB_ENV
            echo "Tag v${RELEASE_VERSION} already exists, skipping version update"
          else
            echo "TAG_EXISTS=false" >> $GITHUB_ENV
            
            # Update pom.xml to release version
            mvn versions:set -DnewVersion=${RELEASE_VERSION} -DgenerateBackupPoms=false
            
            # Commit version change
            git add pom.xml
            git commit -m "Release version ${RELEASE_VERSION}" || true
            git tag -a "v${RELEASE_VERSION}" -m "Release version ${RELEASE_VERSION}"
          fi
      
      - name: Build and publish to GitHub Packages
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B deploy -DskipTests --file pom.xml
      
      - name: Create GitHub Release
        if: github.event.inputs.release == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: Release ${{ env.RELEASE_VERSION }}
          draft: false
          prerelease: false
          files: |
            target/*.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Prepare next development version
        if: github.event.inputs.release == 'true' && env.TAG_EXISTS == 'false'
        run: |
          # Calculate next snapshot version
          CURRENT_VERSION="${{ env.RELEASE_VERSION }}"
          # Split version into parts (major.minor.patch.build)
          IFS='.' read -ra VERSION_PARTS <<< "$CURRENT_VERSION"
          LAST_PART=$((${VERSION_PARTS[-1]} + 1))
          NEXT_VERSION="${VERSION_PARTS[0]}.${VERSION_PARTS[1]}.${VERSION_PARTS[2]}.${LAST_PART}-SNAPSHOT"
          
          # Update to next snapshot version
          mvn versions:set -DnewVersion=${NEXT_VERSION} -DgenerateBackupPoms=false
          
          # Commit version change
          git add pom.xml
          git commit -m "Prepare next development version ${NEXT_VERSION}"
      
      - name: Push changes
        if: github.event.inputs.release == 'true' && env.TAG_EXISTS == 'false'
        run: |
          git push origin HEAD:${{ github.ref_name }}
          git push origin v${{ env.RELEASE_VERSION }}
      
      - name: Skip message
        if: github.event.inputs.release == 'true' && env.TAG_EXISTS == 'true'
        run: |
          echo "⚠️ Tag v${{ env.RELEASE_VERSION }} already exists. Skipping git push."
          echo "The build and deployment to GitHub Packages was still executed."


name: Build and Publish

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a release (automatically manages versions)'
        required: false
        default: false
        type: boolean
      release_version:
        description: 'Release version (optional, e.g., 1.0.1.10)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Build with Maven
        run: mvn -B clean package --file pom.xml
      
      - name: Run tests
        run: mvn -B test --file pom.xml
      
      - name: Get project version
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Project version: ${VERSION}"
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binance-api-client-${{ steps.version.outputs.VERSION }}
          path: target/*.jar
          retention-days: 30
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 30

  publish:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      
      - name: Get project version
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Publishing version: ${VERSION}"
      
      - name: Publish SNAPSHOT to GitHub Packages
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B deploy -DskipTests --file pom.xml

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.create_release == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      
      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
      
      - name: Determine release version
        id: version
        run: |
          CURRENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          
          if [ -n "${{ inputs.release_version }}" ]; then
            RELEASE_VERSION="${{ inputs.release_version }}"
          else
            # Remove -SNAPSHOT from current version
            RELEASE_VERSION=$(echo $CURRENT_VERSION | sed 's/-SNAPSHOT//')
          fi
          
          # Calculate next development version
          IFS='.' read -ra VERSION_PARTS <<< "$RELEASE_VERSION"
          LAST_PART=$((${VERSION_PARTS[-1]} + 1))
          NEXT_VERSION="${VERSION_PARTS[0]}.${VERSION_PARTS[1]}.${VERSION_PARTS[2]}.${LAST_PART}-SNAPSHOT"
          
          echo "RELEASE_VERSION=${RELEASE_VERSION}" >> $GITHUB_OUTPUT
          echo "NEXT_VERSION=${NEXT_VERSION}" >> $GITHUB_OUTPUT
          echo "Release version: ${RELEASE_VERSION}"
          echo "Next development version: ${NEXT_VERSION}"
      
      - name: Set release version
        run: |
          mvn versions:set -DnewVersion=${{ steps.version.outputs.RELEASE_VERSION }} -DgenerateBackupPoms=false
          git add pom.xml
          git commit -m "[maven-release] Prepare release v${{ steps.version.outputs.RELEASE_VERSION }}"
      
      - name: Build and publish release
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B clean deploy -DskipTests --file pom.xml
      
      - name: Create and push tag
        run: |
          TAG_NAME="v${{ steps.version.outputs.RELEASE_VERSION }}"
          
          # Delete tag if it exists locally
          git tag -d ${TAG_NAME} 2>/dev/null || true
          
          # Delete tag if it exists remotely
          git push origin :refs/tags/${TAG_NAME} 2>/dev/null || true
          
          # Create new tag
          git tag -a ${TAG_NAME} -m "Release version ${{ steps.version.outputs.RELEASE_VERSION }}"
          
          # Push tag
          git push origin ${TAG_NAME}
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.RELEASE_VERSION }}
          name: Release ${{ steps.version.outputs.RELEASE_VERSION }}
          draft: false
          prerelease: false
          files: |
            target/*.jar
          generate_release_notes: true
          body: |
            ## Maven Dependency
            
            ```xml
            <dependency>
              <groupId>com.binance.api</groupId>
              <artifactId>binance-api-client</artifactId>
              <version>${{ steps.version.outputs.RELEASE_VERSION }}</version>
            </dependency>
            ```
            
            Published to GitHub Packages: `https://maven.pkg.github.com/${{ github.repository }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set next development version
        run: |
          mvn versions:set -DnewVersion=${{ steps.version.outputs.NEXT_VERSION }} -DgenerateBackupPoms=false
          git add pom.xml
          git commit -m "[maven-release] Prepare for next development iteration"
      
      - name: Push version changes
        run: |
          git push origin HEAD:${{ github.ref_name }}

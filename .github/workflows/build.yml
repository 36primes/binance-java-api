name: Build and Publish

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with artifacts'
        required: false
        default: 'false'
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Build with Maven
        run: mvn -B clean package --file pom.xml
      
      - name: Run tests
        run: mvn -B test --file pom.xml
      
      - name: Get project version
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Project version: ${VERSION}"
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binance-api-client-${{ steps.version.outputs.VERSION }}
          path: target/*.jar
          retention-days: 30
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 30

  publish:
    needs: build
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      
      - name: Get project version
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Publishing version: ${VERSION}"
      
      - name: Build and publish to GitHub Packages
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B deploy -DskipTests --file pom.xml
      
      - name: Create GitHub Release
        if: inputs.create_release == true || inputs.create_release == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Release ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, 'SNAPSHOT') }}
          files: |
            target/*.jar
          generate_release_notes: true
          body: |
            ## Maven Dependency
            
            ```xml
            <dependency>
              <groupId>com.binance.api</groupId>
              <artifactId>binance-api-client</artifactId>
              <version>${{ steps.version.outputs.VERSION }}</version>
            </dependency>
            ```
            
            Published to GitHub Packages: `https://maven.pkg.github.com/${{ github.repository }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
